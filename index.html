<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>🏯 御医看板</title>
<style>
:root{--bg:#0f1117;--card:#1a1d28;--gold:#c9a96e;--text:#e2e8f0;--muted:#94a3b8;--red:#f87171;--green:#4ade80;--amber:#fbbf24;--border:rgba(201,169,110,.15);--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;color:var(--text);max-width:430px;margin:0 auto;padding-bottom:96px}
header{padding:20px;text-align:center;border-bottom:1px solid var(--border)}
header h1{font-size:18px;font-weight:600;color:var(--gold)}
header .date{font-size:11px;color:var(--muted);margin-top:4px}
.tab-panel{display:none;padding:16px}
.tab-panel.active{display:block}
.sl{font-size:13px;color:var(--gold);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.sl .ar{font-size:10px;transition:transform .2s}
.sb{overflow:hidden;transition:max-height .3s}
.sb.hidden{max-height:0!important}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fr{display:flex;gap:8px}
.fr .fg{flex:1}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:15px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:50px}
.tr{display:flex;gap:8px}
.tb{flex:1;padding:10px;text-align:center;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:14px;cursor:pointer;user-select:none;transition:all .15s}
.tb:active{transform:scale(.97)}
.tb.on{background:rgba(74,222,128,.15);color:var(--green);border-color:rgba(74,222,128,.3)}
.tb.off{background:rgba(248,113,113,.15);color:var(--red);border-color:rgba(248,113,113,.3)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#b8944e);color:var(--bg);border:none;border-radius:var(--r);font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:active{opacity:.85;transform:scale(.98)}
.btn.sm{font-size:14px;padding:10px}
.sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.sc{background:var(--card);border-radius:var(--r);padding:13px;text-align:center;border:1px solid var(--border)}
.sc .v{font-size:24px;font-weight:700}
.sc .l{font-size:10px;color:var(--muted);margin-top:2px}
.sc.g .v{color:var(--green)}.sc.w .v{color:var(--amber)}.sc.b .v{color:var(--red)}
.cb{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.cb .ct{font-size:11px;color:var(--gold);margin-bottom:8px;font-weight:500}
.tl{position:relative;padding-left:28px}
.tl::before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:1.5px;background:rgba(201,169,110,.3)}
.tli{position:relative;margin-bottom:16px;padding-left:12px}
.tli::before{content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.tli .tt{font-size:11px;color:var(--gold);margin-bottom:2px;font-weight:500}
.tli .tc{font-size:13px;line-height:1.7}
.sr{display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer;padding:3px 0;user-select:none}
.sr:active{opacity:.7}
.sb2{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sr.d .sb2{border-color:var(--green);background:rgba(74,222,128,.15)}
.sr.d .sb2::after{content:'✓';font-size:10px;color:var(--green);font-weight:700}
.sr.d .sl2{text-decoration:line-through;color:var(--muted)}
.sr .sl2{font-size:13px}
.hg{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.hc{background:var(--card);border-radius:var(--r);padding:14px 8px;text-align:center;border:1px solid var(--border)}
.hc .ri{width:60px;height:60px;margin:0 auto 6px}
.hc .ri canvas{width:100%!important;height:100%!important}
.hc .ht{font-size:12px;color:var(--text);font-weight:500}
.hc .hs{font-size:10px;color:var(--muted);margin-top:1px}
.rc{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.rc .rh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rc .ra{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:#1e2235}
.rc .rn{font-size:14px;font-weight:600;color:var(--gold)}
.rc .rb{font-size:13px;line-height:1.8}
.rc .rl{padding:2px 0 2px 12px;position:relative}
.rc .rl::before{content:'';position:absolute;left:0;top:11px;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.5}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(15,17,23,.92);border-top:1px solid var(--border);display:flex;z-index:100;padding:6px 0 env(safe-area-inset-bottom,6px);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
nav .ni{flex:1;text-align:center;color:var(--muted);font-size:10px;padding:4px 0;cursor:pointer;transition:all .15s;user-select:none}
nav .ni .ne{display:block;font-size:20px;margin-bottom:1px}
nav .ni.ac{color:var(--gold)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--bg);padding:10px 24px;border-radius:24px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:opacity .15s;pointer-events:none}
.toast.show{opacity:1}
.chart-wrap{position:relative;width:100%;height:180px}
.chart-wrap canvas{width:100%!important;height:100%!important}
@media(min-width:431px){body{max-width:100%;padding:0 16px 80px}.sg{grid-template-columns:repeat(6,1fr)!important}nav{max-width:100%!important;left:0!important;transform:none!important}}
</style>
</head>
<body>

<header><h1>🏯 御医看板</h1><div class="date" id="hd"></div></header>

<!-- Tab: 录入 -->
<div class="tab-panel active" id="tab-entry">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <input type="date" id="ed" style="width:auto;font-size:13px;padding:7px 10px" onchange="ld()">
    <span style="font-size:12px;color:var(--muted)" id="ew"></span>
    <span style="font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(74,222,128,.12);color:var(--green);font-weight:500;display:none" id="tb">今天</span>
  </div>

  <div class="sl" onclick="ts('sm')">☀️ 晨检数据 <span class="ar">▾</span></div>
  <div class="sb" id="sm">
    <div class="fr"><div class="fg"><label>清醒时间 (min)</label><input type="number" id="aw" placeholder="33"></div><div class="fg"><label>快速动眼 REM (min)</label><input type="number" id="rs" placeholder="66"></div></div>
    <div class="fr"><div class="fg"><label>核心睡眠 (min)</label><input type="number" id="cs" placeholder="351"></div><div class="fg"><label>深度睡眠 (min)</label><input type="number" id="ds" placeholder="44"></div></div>
    <div class="fr"><div class="fg"><label>入睡时间</label><input type="time" id="bt"></div><div class="fg"><label>起床时间</label><input type="time" id="wt"></div></div>
    <div class="fr"><div class="fg"><label>❤️ 心率 (bpm)</label><input type="number" id="hr" placeholder="74"></div><div class="fg"><label>📈 HRV (ms)</label><input type="number" id="hv" placeholder="可选"></div><div class="fg"><label>⚖️ 体重 (kg)</label><input type="number" id="bw" placeholder="84.0" step="0.1"></div></div>
    <div class="fr"><div class="fg"><label>📱 睡前刷手机 (min)</label><input type="number" id="sv" placeholder="30"></div><div class="fg"><label>🔒 内守 第</label><input type="number" id="ab" placeholder="天"></div></div>
    <div class="fg"><label>😰 焦虑 (1-10)</label><input type="number" id="ax" placeholder="5" min="0" max="10"></div>
    <div class="fg"><label>💬 感受</label><input type="text" id="fl" placeholder="一句话概括今天的状态..."></div>
    <div style="font-size:11px;color:var(--muted);padding:4px 0">自动计算: 总睡眠 = (核心+深睡+REM) ÷ 60</div>
    <button class="btn sm" onclick="sv('morning')">💾 保存晨检</button>
  </div>

  <div class="sl" onclick="ts('sd')">🍽️ 饮食记录 <span class="ar">▾</span></div>
  <div class="sb" id="sd">
    <div class="fg"><label>🍌 拳击前（如有）</label><input type="text" id="pb" placeholder="半根香蕉 + 黑咖啡"></div>
    <div class="fg"><label>🍱 午餐</label><textarea id="lu" placeholder="牛丸牛杂粿条 ~570kcal 34g蛋白" rows="2"></textarea></div>
    <div class="fg"><label>🍲 晚餐</label><textarea id="di" placeholder="沙姜鸡套餐 ~620kcal 60g蛋白" rows="2"></textarea></div>
    <div style="display:flex;gap:8px"><div class="fg" style="flex:1"><label>🕐 开窗</label><input type="time" id="fs"></div><div class="fg" style="flex:1"><label>🔒 关窗</label><input type="time" id="fe"></div></div>
    <button class="btn sm" onclick="sv('diet')">💾 保存饮食</button>
  </div>

  <div class="sl" onclick="ts('st')">🥊 训练记录 <span class="ar">▾</span></div>
  <div class="sb" id="st">
    <div class="tr"><div class="tb" id="bb" onclick="tg('boxing')">拳击</div><div class="tb" id="bf" onclick="tg('fasting')">断食</div></div>
    <div class="fr" style="margin-top:10px"><div class="fg"><label>时长 (min)</label><input type="number" id="td" placeholder="60"></div><div class="fg"><label>热量 (kcal)</label><input type="number" id="tc" placeholder="600"></div></div>
    <div class="fr"><div class="fg"><label>最高心率</label><input type="number" id="th" placeholder="171"></div><div class="fg"><label>平均心率</label><input type="number" id="ta" placeholder="118"></div></div>
    <button class="btn sm" onclick="sv('training')">💾 保存训练</button>
  </div>

  <div style="margin-top:20px;padding:12px;background:var(--card);border-radius:var(--r)">
    <div style="font-size:12px;color:var(--gold);margin-bottom:8px">🔑 GitHub Token（仅存手机，一次设置）</div>
    <input type="password" id="ti" placeholder="ghp_..." style="margin-bottom:8px;font-size:13px">
    <button class="btn sm" onclick="stk()">保存 Token</button>
    <div style="font-size:10px;color:var(--muted);margin-top:6px" id="ts2"></div>
  </div>
  <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);text-align:center">
    <button id="bs" class="btn" style="background:linear-gradient(135deg,#c9a96e,#e0556a);font-size:16px">📡 提交到御医团队</button>
    <div style="font-size:10px;color:var(--muted);margin-top:8px" id="ss">提交后华佗/如意/张教练将收到数据</div>
  </div>
</div>

<!-- Tab: 看板 -->
<div class="tab-panel" id="tab-dashboard">
  <div class="sg" id="tstats"></div>
  <div class="cb"><div class="ct">⚖️ 体重趋势 · 15天</div><div class="chart-wrap"><canvas id="chW"></canvas></div></div>
  <div class="cb"><div class="ct">🌙 睡眠时长 · 7天</div><div class="chart-wrap"><canvas id="chS"></canvas></div></div>
  <div class="cb"><div class="ct">💤 深睡趋势 · 7天</div><div class="chart-wrap"><canvas id="chD"></canvas></div></div>
  <div class="cb"><div class="ct">❤️ 静息心率 · 7天</div><div class="chart-wrap"><canvas id="chH"></canvas></div></div>
</div>

<!-- Tab: 补剂 -->
<div class="tab-panel" id="tab-supplements"><div class="tl" id="suppT"></div></div>

<!-- Tab: 习惯 -->
<div class="tab-panel" id="tab-habits"><div class="hg" id="rings"></div><div style="margin-top:12px;font-size:12px;color:var(--muted)" id="wd"></div></div>

<!-- Tab: 团队 -->
<div class="tab-panel" id="tab-team">
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px;text-align:center">每日处方 · 数据驱动 · 晨检同步</div>
  <div id="teamRx"></div>
</div>

<nav>
  <div class="ni ac" onclick="sw('entry',this)"><span class="ne">📝</span>录入</div>
  <div class="ni" onclick="sw('dashboard',this)"><span class="ne">📊</span>看板</div>
  <div class="ni" onclick="sw('supplements',this)"><span class="ne">💊</span>补剂</div>
  <div class="ni" onclick="sw('habits',this)"><span class="ne">🎯</span>习惯</div>
  <div class="ni" onclick="sw('team',this)"><span class="ne">🏯</span>团队</div>
</nav>
<div class="toast" id="toast"></div>

<script>
var D=[],P={},bv=null,fv=null;
var K='ihd',SK='isc',GH='https://api.github.com/repos/mrdeng33/imperial-health';

async function lbd(){
  try{var r=await fetch('data.json');if(r.ok)D=await r.json()}catch(e){}
  try{var r2=await fetch('prescriptions.json');if(r2.ok)P=await r2.json()}catch(e){}
}
function ld2(){
  var l=JSON.parse(localStorage.getItem(K)||'[]'),m={};
  D.forEach(function(d){m[d.date]=Object.assign({},d)});
  l.forEach(function(d){m[d.date]=Object.assign(m[d.date]||{},d)});
  return Object.values(m).sort(function(a,b){return a.date.localeCompare(b.date)});
}
function sd(d){localStorage.setItem(K,JSON.stringify(d))}
function td(){return new Date().toISOString().split('T')[0]}
function tk(){return localStorage.getItem('gt')||''}
function st2(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

async function init(){
  await lbd();
  document.getElementById('hd').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  document.getElementById('ed').value=td();uw();ld3();rd();rs2();rh();rt();
  document.getElementById('tb').style.display=document.getElementById('ed').value===td()?'inline':'none';
  var t=tk();if(t){document.getElementById('ti').value=t;document.getElementById('ts2').textContent='✅ 已配置（'+t.slice(0,7)+'...）';document.getElementById('ts2').style.color='var(--green)'}
}
function uw(){var d=new Date(document.getElementById('ed').value);document.getElementById('ew').textContent='星期'+['日','一','二','三','四','五','六'][d.getDay()]}
function ld3(){
  var e=ld2().find(function(d){return d.date===document.getElementById('ed').value});
  'aw,rs,cs,ds,hr,hv,bw,sv,ab,ax,fl,bt,wt,lu,di,pb,fs,fe,td,tc,th,ta'.split(',').forEach(function(f){
    var el=document.getElementById(f);if(el)el.value=(e&&e[f]!==undefined)?e[f]:'';
  });
  bv=(e&&e.boxing!==undefined)?e.boxing:null;tui('bb',bv);fv=(e&&e.fasting!==undefined)?e.fasting:null;tui('bf',fv);
}
function tg(t){
  if(t==='boxing'){bv=bv===true?false:bv===false?null:true;tui('bb',bv)}
  else{fv=fv===true?false:fv===false?null:true;tui('bf',fv)}
}
function tui(id,v){
  var el=document.getElementById(id);el.classList.remove('on','off');
  if(v===true){el.classList.add('on');el.textContent=id==='bb'?'拳击 ✅':'断食 ✅'}
  else if(v===false){el.classList.add('off');el.textContent=id==='bb'?'拳击 ❌':'断食 ❌'}
  else el.textContent=id==='bb'?'拳击':'断食';
}
function ts(id){document.getElementById(id).classList.toggle('hidden')}

function sv(s){
  var date=document.getElementById('ed').value,data=ld2(),e=data.find(function(d){return d.date===date});
  if(!e){e={date:date};data.push(e)}
  if(s==='morning'){
    var fm2={aw:'awakeTime',rs:'remSleep',cs:'coreSleep',ds:'deepSleep',hr:'heartRate',hv:'hrv',bw:'weight',sv:'shortVideo',ab:'abstinence',ax:'anxiety',fl:'feeling',bt:'bedtime',wt:'wakeTime'};
    Object.keys(fm2).forEach(function(k){var v=document.getElementById(k).value;if(v!==''&&v!==undefined){var n=fm2[k];e[n]=(n==='feeling'||n==='bedtime'||n==='wakeTime')?v:parseFloat(v)||parseInt(v)||v}else delete e[fm2[k]]});
    var cs2=parseInt(document.getElementById('cs').value)||0,ds2=parseInt(document.getElementById('ds').value)||0,rs2=parseInt(document.getElementById('rs').value)||0;
    if(cs2+ds2+rs2>0)e.sleepTotal=Math.round((cs2+ds2+rs2)/0.6)/100;
  }
  if(s==='diet'){var dm={lu:'lunch',di:'dinner',pb:'preBoxingFood',fs:'fastingStart',fe:'fastingEnd'};Object.keys(dm).forEach(function(k){var v=document.getElementById(k).value;if(v!==''&&v!==undefined)e[dm[k]]=v;else delete e[dm[k]]})}
  if(s==='training'){e.boxing=bv;e.fasting=fv;var tm={td:'trainingDur',tc:'trainingCal',th:'trainingMaxHR',ta:'trainingAvgHR'};Object.keys(tm).forEach(function(k){var v=document.getElementById(k).value;if(v!==''&&v!==undefined)e[tm[k]]=parseInt(v)||0;else delete e[tm[k]]})}
  data.sort(function(a,b){return a.date.localeCompare(b.date)});sd(data);
  st2('✅ 已保存');rd();rh();rs2();rt();
}

// Dashboard
function rd(){
  var data=ld2(),t0=td(),t=data.find(function(d){return d.date===t0})||data[data.length-1];
  if(!t){document.getElementById('tstats').innerHTML='<div style="grid-column:span 3;text-align:center;color:var(--muted);padding:20px">暂无数据</div>';return}
  var s=t.sleepTotal?Number(t.sleepTotal).toFixed(1):'--',d=t.deepSleep||'--',h=t.heartRate||'--',w=t.weight||'--';
  var dc=typeof t.deepSleep=='number'?(t.deepSleep<20?'b':t.deepSleep<35?'w':'g'):'';
  var hc=typeof t.heartRate=='number'?(t.heartRate>80?'w':t.heartRate<55?'w':'g'):'';
  document.getElementById('tstats').innerHTML=
    '<div class="sc"><div class="v">'+s+'h</div><div class="l">总睡眠</div></div>'+
    '<div class="sc '+dc+'"><div class="v">'+d+'m</div><div class="l">深睡</div></div>'+
    '<div class="sc '+hc+'"><div class="v">'+h+'</div><div class="l">心率</div></div>'+
    '<div class="sc"><div class="v">'+w+'</div><div class="l">体重 kg</div></div>'+
    '<div class="sc"><div class="v">'+(t.boxing===true?'✅':t.boxing===false?'❌':'—')+'</div><div class="l">拳击</div></div>'+
    '<div class="sc"><div class="v">'+(t.anxiety||'—')+'</div><div class="l">焦虑 /10</div></div>';
  var ln=function(d,n){var a=d.filter(function(x){return x.date}).sort(function(a,b){return a.date.localeCompare(b.date)});return a.slice(-n)};
  drawLine('chW',ln(data,15).filter(function(x){return x.weight}).map(function(x){return {l:x.date.slice(5),v:x.weight}}),70,88,'kg');
  drawLine('chS',ln(data,7).filter(function(x){return x.sleepTotal}).map(function(x){return {l:x.date.slice(5),v:x.sleepTotal}}),4,9,'h');
  drawLine('chD',ln(data,7).filter(function(x){return x.deepSleep}).map(function(x){return {l:x.date.slice(5),v:x.deepSleep}}),0,60,'min');
  drawLine('chH',ln(data,7).filter(function(x){return x.heartRate}).map(function(x){return {l:x.date.slice(5),v:x.heartRate}}),50,100,'bpm');
}
function drawLine(id,pts,min,max,unit){
  var c=document.getElementById(id);if(!c||!pts.length)return;
  var dpr=window.devicePixelRatio||1,W=c.parentElement.clientWidth,H=180;
  c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';
  var ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  var pad={t:16,r:12,b:28,l:36},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
  ctx.strokeStyle='rgba(148,163,184,.08)';ctx.lineWidth=1;
  for(var i=0;i<=4;i++){var y=pad.t+h*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke()}
  ctx.fillStyle='#94a3b8';ctx.font='9px -apple-system,sans-serif';ctx.textAlign='right';
  for(var i=0;i<=4;i++){var yv=Math.round(min+(max-min)*i/4);ctx.fillText(yv+unit,pad.l-4,pad.t+h*(4-i)/4+3)}
  ctx.textAlign='center';
  for(var i=0;i<pts.length;i+=Math.max(1,Math.floor(pts.length/5))){var x=pad.l+w*i/(pts.length-1);ctx.fillText(pts[i].l,x,H-pad.b+14)}
  ctx.beginPath();ctx.strokeStyle='#c9a96e';ctx.lineWidth=2;ctx.lineCap='round';
  var sx=function(i){return pad.l+w*i/(pts.length-1)},sy=function(v){return pad.t+h*(1-(v-min)/(max-min))};
  ctx.moveTo(sx(0),sy(pts[0].v));
  for(var i=1;i<pts.length;i++)ctx.bezierCurveTo(sx(i-1)+w/(pts.length-1)/3,sy(pts[i-1].v),sx(i)-w/(pts.length-1)/3,sy(pts[i].v),sx(i),sy(pts[i].v));
  ctx.stroke();
  ctx.lineTo(sx(pts.length-1),pad.t+h);ctx.lineTo(sx(0),pad.t+h);ctx.closePath();
  ctx.fillStyle='rgba(201,169,110,.06)';ctx.fill();
  for(var i=0;i<pts.length;i++){ctx.beginPath();ctx.arc(sx(i),sy(pts[i].v),3,0,Math.PI*2);ctx.fillStyle='#c9a96e';ctx.fill()}
}

function getsc(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}}}
function rs2(){
  var supps=[
    {t:'起床空腹',i:['☕ 黑咖啡 1杯']},
    {t:'午餐后 · 12-13点',i:['🧠 Neuriva Ultra ×2','🐟 Omega Mini ×3','☀️ D3+K2 ×1','🔩 锌 ×1','💊 Men\'s Multi ×1']},
    {t:'拳击后 · 30分钟内',i:['💪 ON乳清蛋白 1勺'],bx:true},
    {t:'晚餐后',i:['🫁 Liver Detox']},
    {t:'睡前 · 30分钟',i:['🌙 甘氨酸镁 200-400mg']}
  ];
  var t0=td(),td2=ld2().find(function(d){return d.date===t0}),isBx=td2&&td2.boxing===true;
  var ch=getsc(),tc2=ch[t0]||{},gi=0,h='';
  supps.forEach(function(s){if(s.bx&&!isBx)return;
    h+='<div class="tli"><div class="tt">'+s.t+'</div><div class="tc">';
    s.i.forEach(function(it){var dn=tc2[gi]===true;h+='<div class="sr'+(dn?' d':'')+'" onclick="ts2('+gi+')"><div class="sb2"></div><span class="sl2">'+it+'</span></div>';gi++});
    h+='</div></div>';
  });
  document.getElementById('suppT').innerHTML=h||'<div style="text-align:center;color:var(--muted);padding:20px">暂无数据</div>';
}
function ts2(idx){var t0=td(),c=getsc();if(!c[t0])c[t0]={};c[t0][idx]=!c[t0][idx];localStorage.setItem(SK,JSON.stringify(c));rs2()}

// Habits
function rh(){
  var data=ld2(),now=new Date(),day=now.getDay(),mon=new Date(now);mon.setDate(now.getDate()-(day===0?6:day-1));mon.setHours(0,0,0,0);
  var wd2=data.filter(function(d){return d.date>=mon.toISOString().split('T')[0]&&d.date<=td()});
  var bc=wd2.filter(function(d){return d.boxing===true}).length;
  var fc=wd2.filter(function(d){return d.fasting===true}).length;
  var svc=wd2.filter(function(d){return typeof d.shortVideo=='number'&&d.shortVideo<=30}).length;
  var td3=Math.max(1,Math.ceil((now-mon)/86400000)+1);
  var abs=0;for(var i=data.length-1;i>=0;i--){if(typeof data[i].abstinence=='number'){abs=data[i].abstinence;break}}
  document.getElementById('rings').innerHTML=
    '<div class="hc"><div class="ri"><canvas id="rBx"></canvas></div><div class="ht">拳击 '+bc+'/3</div><div class="hs">本周</div></div>'+
    '<div class="hc"><div class="ri"><canvas id="rFs"></canvas></div><div class="ht">断食 '+fc+'/7</div><div class="hs">目标5天</div></div>'+
    '<div class="hc"><div class="ri"><canvas id="rSv"></canvas></div><div class="ht">睡前刷手机 '+svc+'/'+td3+'天</div><div class="hs">睡前≤30min</div></div>'+
    '<div class="hc"><div class="ri"><canvas id="rAb"></canvas></div><div class="ht">内守 '+abs+'/30</div><div class="hs">连续天数</div></div>';
  var dh='';wd2.slice().reverse().forEach(function(d){var wd3=new Date(d.date).getDay(),bx2=d.boxing===true?'🥊':d.boxing===false?'❌':'-',fs2=d.fasting===true?'✅':d.fasting?'⚠️':'-',sv2=typeof d.shortVideo=='number'?d.shortVideo+'min':'-',ab2=typeof d.abstinence=='number'?'🔒'+d.abstinence+'天':'-';dh+='<div style="padding:5px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px"><span>'+d.date.slice(5)+' 周'+'日一二三四五六'[wd3]+'</span><span>'+bx2+'|'+fs2+'|📱'+sv2+'|'+ab2+'</span></div>'});
  document.getElementById('wd').innerHTML=dh||'暂无数据';
  setTimeout(function(){dr('rBx',bc,3,'#f87171');dr('rFs',fc,7,'#fbbf24');dr('rSv',svc,td3,'#4ade80');dr('rAb',abs,30,'#94a3b8')},100);
}
function dr(cid,cnt,tgt,color){
  var c=document.getElementById(cid);if(!c||c.width)return;var dpr=window.devicePixelRatio||1,sz=64*dpr;c.width=sz;c.height=sz;c.style.width='64px';c.style.height='64px';
  var ctx=c.getContext('2d');ctx.scale(dpr,dpr);var r=25,lw=4;
  ctx.beginPath();ctx.arc(32,32,r,0,Math.PI*2);ctx.strokeStyle='rgba(148,163,184,.1)';ctx.lineWidth=lw;ctx.stroke();
  var pct=Math.min(cnt/tgt,1);ctx.beginPath();ctx.arc(32,32,r,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
  ctx.fillStyle='#e2e8f0';ctx.font='bold 14px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(cnt,32,32);
}

// Team
function rt(){
  var t0=td(),rx=P[t0];
  if(!rx){document.getElementById('teamRx').innerHTML='<div style="text-align:center;color:var(--muted);padding:30px">今日处方尚未生成<br>等待华佗晨检...</div>';return}

// Token
function stk(){var v=document.getElementById('ti').value.trim();if(v.slice(0,4)==='ghp_'){localStorage.setItem('gt',v);document.getElementById('ts2').textContent='✅ Token 已保存';document.getElementById('ts2').style.color='var(--green)';st2('✅ Token 已保存')}else if(v){alert('Token 格式不对，应以 ghp_ 开头')}}

// Submit
async function subm(){
  var token=tk();if(!token){document.getElementById('ss').textContent='⚠️ 请先在上方输入 GitHub Token';document.getElementById('ss').style.color='var(--amber)';return}
  var date=document.getElementById('ed').value,entry={date:date};
  var fmap={aw:'awakeTime',rs:'remSleep',cs:'coreSleep',ds:'deepSleep',hr:'heartRate',hv:'hrv',bw:'weight',sv:'shortVideo',ab:'abstinence',ax:'anxiety',fl:'feeling',bt:'bedtime',wt:'wakeTime',lu:'lunch',di:'dinner',pb:'preBoxingFood',fs:'fastingStart',fe:'fastingEnd',td:'trainingDur',tc:'trainingCal',th:'trainingMaxHR',ta:'trainingAvgHR'};
  Object.keys(fmap).forEach(function(f){var el=document.getElementById(f);if(el&&el.value!=='')entry[fmap[f]]=isNaN(el.value)?el.value:parseFloat(el.value)||parseInt(el.value)||el.value});
  entry.boxing=bv;entry.fasting=fv;
  var st=document.getElementById('ss');st.textContent='⏳ 正在提交...';st.style.color='var(--amber)';
  var H={Authorization:'token '+token,'Content-Type':'application/json',Accept:'application/vnd.github+json'};
  try{
    var r1=await fetch(GH+'/contents/data.json',{headers:H,cache:'no-store'});
    if(!r1.ok)throw new Error('读取失败 HTTP '+r1.status);
    var f=await r1.json(),data=JSON.parse(atob(f.content));
    var idx=data.findIndex(function(d){return d.date===date});
    if(idx>=0)data[idx]=Object.assign(data[idx],entry);else data.push(entry);
    data.sort(function(a,b){return a.date.localeCompare(b.date)});
    var json=JSON.stringify(data,null,2);
    var b64=await new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(r.result.split(',')[1])};r.readAsDataURL(new Blob([json],{type:'text/plain;charset=UTF-8'}))});
    var r2=await fetch(GH+'/contents/data.json',{method:'PUT',headers:H,body:JSON.stringify({message:'📱 '+date,content:b64,sha:f.sha})});
    if(r2.ok){st.textContent='✅ 已提交！';st.style.color='var(--green)';st2('✅ 已提交到御医')}
    else{var e2=await r2.json();st.textContent='❌ '+(e2.message||'失败');st.style.color='var(--red)'}
  }catch(e){st.textContent='❌ '+e.message;st.style.color='var(--red)'}
}

// Tabs
function sw(tab,el){
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('ac')});
  document.getElementById('tab-'+tab).classList.add('active');if(el)el.classList.add('ac');
  if(tab==='dashboard')rd();if(tab==='supplements')rs2();if(tab==='habits')rh();if(tab==='team')rt();
}

(function(){var t=tk();if(t){document.getElementById('ti').value=t;document.getElementById('ts2').textContent='✅ 已配置（'+t.slice(0,7)+'...）';document.getElementById('ts2').style.color='var(--green)'}})();
init();
